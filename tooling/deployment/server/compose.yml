# Production stack for the interview-manage app on the Aliyun ECS host.
# Isolated from the pre-existing `new-api` compose project: service DNS names
# (`postgres`, `redis`) only resolve inside this project's network, and the app
# port is bound to loopback so the host Nginx owns all public routing.
name: interview-manage

services:
  postgres:
    # Matches the image pre-pulled on the target host (no public egress);
    # bump to a newer tag only after the host can pull it.
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 384m
    networks:
      - internal

  redis:
    image: redis:latest
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 128m
    networks:
      - internal

  app:
    image: interview-manage:20261106
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_URL=${APP_URL:?APP_URL is required}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is required}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:?ENCRYPTION_SECRET is required}
      - REDIS_URL=redis://redis:6379
      - LOCAL_STORAGE_PATH=/app/data
      # Invite-only sign-up (packages/env default is false). Pulled from the
      # host .env via compose variable substitution; flip there to disable.
      - FLAG_INVITATION_ONLY=${FLAG_INVITATION_ONLY:-false}
      # The pre-existing mihomo proxy on the host (port 7890) is the server's
      # general outbound path. Node 24's built-in proxy support routes fetch()
      # through it. NO_PROXY keeps self-hairpin, internal services, the PDF
      # font CDNs, and open.bigmodel.cn direct — the font CDNs were verified
      # directly reachable on 2026-10-28 (mihomo upstream subscription was
      # returning 405), and the Zhipu AI endpoint is a domestic service that
      # custom AI providers call without needing the proxy.
      - NODE_USE_ENV_PROXY=1
      # Node fetch defaults to trying IPv6 first for the font CDNs; the host has
      # no IPv6 route, so undici connect attempts intermittently hit the 10s
      # timeout (verified 2026-10-28: 1-of-3 fetches timed out without this,
      # 3-of-3 passed with it). Same fix as the local e2e NODE_OPTIONS.
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1,postgres,redis,8.148.199.165,fonts.gstatic.com,cdn.jsdelivr.net,open.bigmodel.cn
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - appdata:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 800m
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  appdata:

networks:
  internal:
    driver: bridge
