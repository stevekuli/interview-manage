# interview-manage nginx site — mirrors /etc/nginx/sites-available/interview-manage on the server.
# Canonical entrance is https://interview.unlimit.ltd (server_name block + Certbot TLS, added
# 2026-10-22 server-side); this file was synced to the server state on 2026-10-27.
# Websockets/SSE (agent streaming): buffering off, upgrade headers forwarded.

# Legacy IP entry — redirects to the canonical domain since 2026-10-27.
# APP_URL is https, so Secure session cookies cannot be set over plain http;
# a redirect to the main entrance beats a silently broken login here.
server {
    listen 3012 default_server;
    listen [::]:3012 default_server;
    server_name _;
    return 301 https://interview.unlimit.ltd$request_uri;
}

# interview.unlimit.ltd HTTPS entry (TLS via Certbot)
server {
    server_name interview.unlimit.ltd;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.unlimit.ltd/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.unlimit.ltd/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = interview.unlimit.ltd) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name interview.unlimit.ltd;
    return 404; # managed by Certbot
}
